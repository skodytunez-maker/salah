<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">SALAH — the sky through the day</title>
<desc id="desc">A calm mosque silhouette beneath a sunrise arc and a deep blue evening sky. A small sequence of shaded Moon discs illustrates lunar phases. The release card adds moving Sun and Moon layers and passing cloud cover using its shared motion controls.</desc>
