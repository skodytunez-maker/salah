 <linearGradient id="horizon" x2="0" y2="1"><stop stop-color="#bfa278" stop-opacity="0"/><stop offset="1" stop-color="#dcae72" stop-opacity=".3"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#17253b"/><stop offset="1" stop-color="#0a1526"/></linearGradient>
 <clipPath id="frame"><rect x="8" y="8" width="624" height="404" rx="25"/></clipPath>
 <clipPath id="moon"><circle r="12"/></clipPath>
</defs>
