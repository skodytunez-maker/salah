<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc"><title id="title">Добровольная регистрация гостя в SALAH</title><desc id="desc">История гостя связана с этим браузером или приложением. Рядом показано предложение сохранить прослушанное: Создать аккаунт или войти и Не сейчас. Слушать Коран можно без регистрации.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b2a42"/><stop offset="1" stop-color="#0b1424"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ead8aa"/><stop offset="1" stop-color="#c2a46c"/></linearGradient></defs><rect width="640" height="390" rx="26" fill="#0b1424"/><rect x="12" y="12" width="616" height="366" rx="22" fill="url(#bg)" stroke="#43536e"/><g font-family="Arial,sans-serif"><text x="34" y="41" fill="#dfc991" font-size="17" letter-spacing="1">ГОСТЬ В SALAH</text><rect x="34" y="71" width="236" height="252" rx="20" fill="#0d192b" stroke="#475b76"/><path d="M35 108h234" stroke="#35465f"/><g fill="#9eaeC2"><circle cx="53" cy="90" r="3"/><circle cx="65" cy="90" r="3"/><circle cx="77" cy="90" r="3"/></g><text x="249" y="94" text-anchor="end" fill="#9eafc5" font-size="10">SALAH</text><g text-anchor="middle"><text x="152" y="135" fill="#c5d0df" font-size="14">Этот браузер</text><circle cx="152" cy="178" r="26" fill="#25354b" stroke="#c7b47e"/><text x="152" y="187" fill="#dfc991" font-size="25">Я</text><text x="152" y="232" fill="#f1eee6" font-size="26">12 мин 34 с</text><text x="152" y="256" fill="#aebbcf" font-size="13">Гость · Янтарь</text><text x="152" y="296" fill="#d7c59d" font-size="12">История на этом устройстве</text></g><rect x="298" y="71" width="308" height="252" rx="20" fill="#17243a" stroke="#b6a273"/><text x="319" y="106" fill="#f1eee6" font-size="22">Сохраните</text><text x="319" y="133" fill="#f1eee6" font-size="22">прослушанное</text><text x="319" y="163" fill="#bdc8d7" font-size="12">Войдите или создайте аккаунт.</text><text x="319" y="185" fill="#bdc8d7" font-size="12">Слушать можно и без регистрации.</text><rect x="319" y="208" width="266" height="45" rx="13" fill="url(#gold)"/><text x="452" y="236" text-anchor="middle" fill="#172136" font-size="14" font-weight="600">Создать аккаунт или войти</text><text x="452" y="286" text-anchor="middle" fill="#d5c18d" font-size="14">Не сейчас</text><text x="320" y="358" text-anchor="middle" fill="#b6c2d2" font-size="14">Вы решаете, когда зарегистрироваться</text></g></svg>
