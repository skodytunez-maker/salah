<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc"><title id="title">Ночной учёт прослушивания в Топе SALAH</title><desc id="desc">Плеер продолжает чтение. После 90 минут без действий ночью учёт в Топе приостанавливается. Кнопка Я слушаю позволяет продолжить учёт; звук и личная история не останавливаются.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b2a42"/><stop offset="1" stop-color="#0b1424"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ead8aa"/><stop offset="1" stop-color="#c2a46c"/></linearGradient></defs><rect width="640" height="390" rx="26" fill="#0b1424"/><rect x="12" y="12" width="616" height="366" rx="22" fill="url(#bg)" stroke="#43536e"/><g font-family="Arial,sans-serif"><text x="34" y="41" fill="#dfc991" font-size="17" letter-spacing="1">КОРАН · SALAH</text><rect x="34" y="59" width="572" height="91" rx="20" fill="#0c1728" stroke="#42516a"/><rect x="50" y="76" width="48" height="56" rx="12" fill="#25354b" stroke="#8a815f"/><path d="M59 125c0-12 7-20 15-20s15 8 15 20" fill="#708399"/><circle cx="74" cy="94" r="10" fill="#a4b2bf"/><text x="113" y="91" fill="#f0eee7" font-size="19">Ан-Ниса</text><text x="113" y="113" fill="#b6c2d2" font-size="13">Чтение продолжается</text><path d="M113 131h390" stroke="#3f4c61" stroke-width="3" stroke-linecap="round"/><rect x="538" y="76" width="50" height="50" rx="16" fill="url(#gold)"/><path d="M558 91v20m10-20v20" stroke="#172136" stroke-width="4" stroke-linecap="round"/><rect x="34" y="181" width="170" height="84" rx="15" fill="#132036" stroke="#465771"/><rect x="250" y="181" width="170" height="84" rx="15" fill="#132036" stroke="#b89d67"/><g text-anchor="middle"><text x="119" y="208" fill="#aebbcf" font-size="13">Ночью · без действий</text><text x="119" y="242" fill="#e3cea0" font-size="27">90 мин</text><text x="335" y="208" fill="#aebbcf" font-size="13">Топ SALAH</text><text x="335" y="239" fill="#e3cea0" font-size="17">Учёт на паузе</text></g><path d="M215 223h22m-7-6 7 6-7 6m201-6h22m-7-6 7 6-7 6" stroke="#d1b87f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="463" y="199" width="143" height="48" rx="14" fill="url(#gold)"/><text x="534" y="229" fill="#172136" text-anchor="middle" font-size="17" font-weight="600">Я слушаю</text><path d="M34 288h572" stroke="#43516a"/><g fill="#dce2eb" font-size="19" text-anchor="middle"><text x="320" y="321">Чтение и личная история</text><text x="320" y="347">продолжаются</text></g><text x="320" y="367" fill="#aebbcf" text-anchor="middle" font-size="11">Звук не ставится на паузу</text></g></svg>
