<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">SALAH — ответ, копирование и удаление сообщений</title>
<desc id="desc">Схема переписки команды SALAH: слева входящее сообщение, справа своё сообщение с цитатой. Меню у своего сообщения предлагает ответить, скопировать, удалить у себя или удалить у всех. Удаление у всех доступно только автору.</desc>
