<text x="72" y="225" fill="#9caac2" font-size="16">НАШИ ТЕКСТЫ · ПОНЯТНАЯ ТРАНСКРИПЦИЯ</text><text x="72" y="283" fill="#f3dfac" font-size="29">Ля иляха илля-Ллаху</text><text x="72" y="330" fill="#f3dfac" font-size="29">уахда-ху ля шарикя лях.</text><text x="72" y="377" fill="#f3dfac" font-size="26">Ля-ху-ль-мульку уа ля-ху-ль-хамд…</text><text x="72" y="430" fill="#a8b4cb" font-size="18">Остановки: «лях», «хамд», «кадир»</text>
