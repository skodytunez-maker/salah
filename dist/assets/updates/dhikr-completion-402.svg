<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="42" fill="#080f1d"/><rect x="90" y="66" width="1020" height="628" rx="32" fill="#121d30" stroke="#c8bc9c" stroke-opacity=".35"/><text x="150" y="140" fill="#c8bc9c" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">АЗКАРЫ · SALAH</text><text x="150" y="210" fill="#f1eee6" font-family="Georgia,serif" font-size="46">Спокойно завершить зикр</text><circle cx="385" cy="430" r="148" fill="#0b1425" stroke="#c8bc9c" stroke-width="3"/><circle cx="385" cy="430" r="129" fill="none" stroke="#c8bc9c" stroke-opacity=".2"/><text x="385" y="426" fill="#f1eee6" text-anchor="middle" font-family="Georgia,serif" font-size="82">3<tspan font-family="Arial,sans-serif" font-size="28" fill="#aeb9cd"> / 3</tspan></text><text x="385" y="483" fill="#c8bc9c" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">✓ Выполнил</text><text x="605" y="350" fill="#f1eee6" font-family="Arial,sans-serif" font-size="29">Небольшая пауза</text><text x="605" y="397" fill="#aeb9cd" font-family="Arial,sans-serif" font-size="23">Нужное количество выполнено.</text><text x="605" y="440" fill="#aeb9cd" font-family="Arial,sans-serif" font-size="23">Ещё одно нажатие —</text><text x="605" y="477" fill="#aeb9cd" font-family="Arial,sans-serif" font-size="23">и можно продолжить.</text><path d="M605 520h380" stroke="#c8bc9c" stroke-opacity=".25"/><text x="605" y="563" fill="#c8bc9c" font-family="Arial,sans-serif" font-size="22">Дополнительный счёт отдельно</text><text x="150" y="640" fill="#8e9bb0" font-family="Arial,sans-serif" font-size="19">Основной набор и общий итог сохраняются.</text></svg>