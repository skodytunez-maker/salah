<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">SALAH — отдельная прозрачность таблицы и мини-плеера</title>
<desc id="desc">Схема главной SALAH: чёткий горный пейзаж за полупрозрачной таблицей намаза и мини-плеером Корана. Справа включено стекло и показаны два независимых ползунка прозрачности: восемьдесят и шестьдесят пять процентов. Время в схеме не является текущим расписанием.</desc>
