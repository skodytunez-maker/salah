<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Весь Коран без интернета</title><desc id="desc">Экран сохранения 114 сур и чтения всех 604 страниц. Проверенные тексты остаются на устройстве.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c2d46"/><stop offset="1" stop-color="#07101f"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#f1dfb2"/><stop offset="1" stop-color="#bb9959"/></linearGradient></defs><rect width="640" height="420" rx="24" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="32" y="43" fill="#dcc48e" font-size="16" letter-spacing="4">SALAH</text><text x="32" y="81" fill="#f4f0e7" font-size="27">Коран всегда рядом</text><rect x="30" y="104" width="580" height="275" rx="20" fill="#0c1729" stroke="#41516b"/><rect x="51" y="125" width="240" height="230" rx="13" fill="#f1e6c8"/><rect x="306" y="125" width="282" height="230" rx="13" fill="#142239"/><text x="170" y="153" text-anchor="middle" fill="#4b412d" font-size="13">МУСХАФ · 604 СТРАНИЦЫ</text><path d="M78 179H264M90 194H264M78 209H250M89 224H264M78 239H260M78 254H247M94 269H264M78 284H264M89 299H251M78 314H264" fill="none" stroke="#807452" stroke-width="3" stroke-linecap="round"/><text x="327" y="166" fill="#e7d1a0" font-size="22">114 из 114 сур</text><text x="327" y="198" fill="#b8c5d8" font-size="15">Загрузка проверена</text><rect x="326" y="221" width="240" height="6" rx="3" fill="#39465b"/><rect x="326" y="221" width="240" height="6" rx="3" fill="url(#gold)"/><circle cx="343" cy="271" r="14" fill="#d6c08c"/><path d="m336 271 5 5 10-11" fill="none" stroke="#18263b" stroke-width="3" stroke-linecap="round"/><text x="366" y="277" fill="#e6e8ec" font-size="17">На устройстве</text><rect x="326" y="304" width="240" height="34" rx="10" fill="url(#gold)"/><text x="446" y="327" text-anchor="middle" fill="#18263b" font-size="16">Читать без интернета</text></g></svg>
