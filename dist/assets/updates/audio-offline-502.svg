<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Скачанное чтение Корана</title><desc id="desc">Общий список сохранённых аудиозаписей разных чтецов с воспроизведением без сети.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c2d46"/><stop offset="1" stop-color="#07101f"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#f1dfb2"/><stop offset="1" stop-color="#bb9959"/></linearGradient></defs><rect width="640" height="420" rx="24" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="32" y="43" fill="#dcc48e" font-size="16" letter-spacing="4">SALAH</text><text x="32" y="81" fill="#f4f0e7" font-size="27">Ваше скачанное чтение</text><rect x="30" y="104" width="580" height="275" rx="20" fill="#0c1729" stroke="#41516b"/><text x="54" y="143" fill="#e7d1a0" font-size="21">Скачанное</text><text x="586" y="142" text-anchor="end" fill="#9fb2cc" font-size="14">Без интернета</text><rect x="49" y="165" width="542" height="77" rx="13" fill="#18283e"/><circle cx="84" cy="202" r="22" fill="#ccb47c"/><path d="m79 192 15 10-15 10Z" fill="#15243a"/><text x="121" y="196" fill="#f0ede6" font-size="21">Ан-Ниса</text><text x="121" y="223" fill="#c9b37f" font-size="16">Ясир ад-Даусари</text><path d="m549 199 7 7 13-14" fill="none" stroke="#d8c28b" stroke-width="3" stroke-linecap="round"/><rect x="49" y="254" width="542" height="77" rx="13" fill="#122139"/><circle cx="84" cy="291" r="22" fill="#34445c"/><path d="m79 281 15 10-15 10Z" fill="#d8c28b"/><text x="121" y="285" fill="#f0ede6" font-size="21">Аль-Фатиха</text><text x="121" y="312" fill="#c9b37f" font-size="16">Мишари аль-Афаси</text><path d="m549 288 7 7 13-14" fill="none" stroke="#d8c28b" stroke-width="3" stroke-linecap="round"/><text x="54" y="360" fill="#9fb2cc" font-size="14">Только сохранённые записи · один плеер</text></g></svg>
