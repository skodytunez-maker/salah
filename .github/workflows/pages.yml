name: Publish SALAH
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '5 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update official imam records
        run: node scripts/update-haramain-schedule.mjs
      - name: Verify SALAH files
        run: |
          node scripts/build-push-function.mjs --check
          node scripts/check-push.mjs
          node scripts/check-push-client.mjs
          node scripts/check-notification-invite.mjs
          node scripts/check-setup-invite.mjs
          node scripts/check-calendar-occasions.mjs
          node scripts/check-tablet-wallpapers.mjs
          node scripts/check-pages.mjs
          node scripts/check-app-sharing.mjs
          node scripts/check-security.mjs
          node scripts/check-settings.mjs
          node scripts/check-settings-resume.mjs
          node scripts/check-city.mjs
          node scripts/check-wallpapers.mjs
          node scripts/check-weather-data.mjs
          node scripts/check-scene-load.mjs
          node scripts/check-landmarks.mjs
          node scripts/check-shared-account.mjs
          node scripts/check-owner-access.mjs
          node scripts/check-owner-client.mjs
          node scripts/check-owner-release-card.mjs
          node scripts/check-account-presence.mjs
          node scripts/check-notification-status.mjs
          node scripts/check-presence-load.mjs
          node scripts/check-adhkar.mjs
          node scripts/check-adhkar-resume.mjs
          node scripts/check-daily-dua.mjs
          node scripts/check-free-counter.mjs
          node scripts/check-counter-sync.mjs
          node scripts/check-counter-account.mjs
          node scripts/check-tyumen-october.mjs
          node scripts/check-tyumen-sources.mjs
          node scripts/check-tyumen-december.mjs
          node scripts/check-calendar-export.mjs
          node scripts/check-ambient-audio.mjs
          node scripts/check-support-client.mjs
          node scripts/check-support-server.mjs
          node scripts/check-support-transport.mjs
          node scripts/check-quran-session.mjs
          node scripts/check-quran-timing.mjs
          node scripts/check-quran-broadcast.mjs
          node scripts/check-broadcast-audio.mjs
          node scripts/check-updates.mjs
          node scripts/check-app-start.mjs
          node scripts/check-location-permissions.mjs
          node scripts/check-dhikr-reminder.mjs
          node scripts/check-umrah.mjs
          node scripts/check-tahajjud.mjs
          node scripts/check-qibla.mjs
          node scripts/check-learning-navigation.mjs
          node scripts/check-swipes.mjs
          node scripts/check-swipe-motion.mjs
          node scripts/check-native-widget.mjs
          node scripts/check-android-widget.mjs
          node scripts/check-android-update.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload SALAH
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
