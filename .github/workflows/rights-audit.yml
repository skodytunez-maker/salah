name: Verify rights register
on:
  pull_request:
    paths:
      - 'docs/*rights*'
      - 'scripts/check-rights-register.mjs'
      - 'dist/assets/**'
      - 'dist/wallpapers/**'
      - 'dist/js/vendor/*LICENSE*'
      - 'dist/data/*LICENSE*'
      - '.github/workflows/rights-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full build inventory and license notices
        run: node scripts/check-rights-register.mjs --self-test
