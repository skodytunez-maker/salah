name: Verify published SALAH 498
on:
  pull_request:
    paths:
      - '.github/workflows/pwa-update-audit.yml'
      - 'review/verify-player-live-498.py'
permissions:
  contents: read
jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files, video ranges and Android update hash
        run: python3 review/verify-player-live-498.py
