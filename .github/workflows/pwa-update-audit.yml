name: Verify published SALAH 497
on:
  pull_request:
    paths:
      - '.github/workflows/pwa-update-audit.yml'
      - 'review/verify-daily-live-497.py'
permissions:
  contents: read
jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files, Android ZIP and public daily-reminder configuration
        run: python3 review/verify-daily-live-497.py
