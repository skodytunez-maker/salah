name: Verify published SALAH 499
on:
  pull_request:
    paths:
      - '.github/workflows/pwa-update-audit.yml'
      - 'review/verify-guest-live-499.py'
permissions:
  contents: read
jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public files, native update and privacy boundaries
        run: python3 review/verify-guest-live-499.py
