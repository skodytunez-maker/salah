name: Build SALAH iOS simulator
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'dist/**'
      - 'scripts/check-ios-widget.mjs'
      - '.github/workflows/ios-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'dist/**'
      - 'scripts/check-ios-widget.mjs'
      - '.github/workflows/ios-debug.yml'
permissions:
  contents: read
concurrency:
  group: ios-widget-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared widget and mobile contracts
        run: |
          node scripts/check-mobile-foundation.mjs
          node scripts/check-native-widget.mjs
          node scripts/check-android-widget.mjs
          node scripts/check-ios-widget.mjs --fixture "$RUNNER_TEMP/salah-widget-fixture.json"
          node scripts/check-native-local-reminders.mjs
      - name: Run Swift widget model tests
        run: |
          swiftc mobile/native/ios/PrayerWidgetModel.swift mobile/tests/ios/main.swift -o "$RUNNER_TEMP/salah-widget-tests"
          "$RUNNER_TEMP/salah-widget-tests" "$RUNNER_TEMP/salah-widget-fixture.json"
      - name: Install pinned Xcode project editor
        run: gem install xcodeproj -v 1.27.0 --user-install --no-document
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Copy SALAH web bundle
        working-directory: mobile
        run: npm run sync:web
      - name: Create iOS project
        working-directory: mobile
        run: npx cap add ios
      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Configure WidgetKit and verify repeatable generation
        working-directory: mobile
        run: |
          npm run ios:configure
          cp ios/App/App.xcodeproj/project.pbxproj "$RUNNER_TEMP/salah-project.pbxproj"
          npm run ios:configure
          cmp ios/App/App.xcodeproj/project.pbxproj "$RUNNER_TEMP/salah-project.pbxproj"
      - name: Build iOS app including WidgetKit extension
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/salah-ios-build" CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/salah-ios-build" CODE_SIGNING_ALLOWED=NO build
          fi
      - name: Verify widget is inside the compiled app
        run: |
          APP="$RUNNER_TEMP/salah-ios-build/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP/PlugIns/SalahPrayerWidget.appex"
          test -f "$APP/PlugIns/SalahPrayerWidget.appex/SalahPrayerWidget"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/SalahPrayerWidget.appex/Info.plist" | grep -Fx 'com.apple.widgetkit-extension'
          APP_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :SALAHAppGroup' "$APP/Info.plist")
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :SALAHAppGroup' "$APP/PlugIns/SalahPrayerWidget.appex/Info.plist")
          test "$APP_GROUP" = "$WIDGET_GROUP"
          echo 'PASS: actual compiled WidgetKit extension embedded; matching App Group configuration.'
