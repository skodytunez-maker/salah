name: Build SALAH iOS simulator
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-debug.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-debug.yml'
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Copy SALAH web bundle
        working-directory: mobile
        run: npm run sync:web
      - name: Create iOS project
        working-directory: mobile
        run: npx cap add ios
      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Build iOS simulator app
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          fi
