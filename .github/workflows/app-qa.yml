name: Verify complete SALAH app
on:
  pull_request:
    paths: ['dist/**', 'scripts/**', 'docs/**', 'supabase/**', 'tests/staff/**', 'tests/awards/**', '.github/workflows/app-qa.yml']
  push:
    paths: ['dist/**', 'scripts/**', 'docs/**', 'supabase/**', 'tests/staff/**', '.github/workflows/app-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local staff test dependencies
        run: npx --yes pnpm@11.25.0 --dir tests/staff install --frozen-lockfile --ignore-scripts
      - name: Check all application contracts and regressions
        run: node scripts/check-app.mjs "$RUNNER_TEMP/salah-app-qa.json"
      - name: Verify actual staff schema and isolated DOM workflows
        run: |
          node tests/staff/check-database.cjs
          node tests/staff/check-interface.mjs
          node tests/awards/check-database.cjs
          node tests/awards/check-founders.cjs
          node tests/awards/check-interface.mjs
      - name: Save QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salah-app-qa
          path: |
            ${{ runner.temp }}/salah-app-qa.json
            ${{ runner.temp }}/salah-staff-database-checks.json
            ${{ runner.temp }}/salah-staff-interface-checks.json
          if-no-files-found: error
