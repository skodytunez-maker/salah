name: Build SALAH Android debug
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug.yml'
      - 'dist/js/app-release.js'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug.yml'
      - 'dist/js/app-release.js'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Copy SALAH web bundle
        working-directory: mobile
        run: npm run sync:web
      - name: Upload npm license evidence
        uses: actions/upload-artifact@v4
        with:
          name: salah-android-npm-licenses
          path: mobile/reports/
          if-no-files-found: error
      - name: Create Android project
        working-directory: mobile
        run: npx cap add android
      - name: Configure Android native features
        working-directory: mobile
        run: npm run android:configure
      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Re-apply Android native features
        working-directory: mobile
        run: npm run android:configure
      - name: Record runtime dependencies and preserve native notices
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew -I ../scripts/collect-android-licenses.gradle :app:salahNativeLicenseReport --stacktrace
      - name: Upload Android runtime dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: salah-android-native-evidence
          path: mobile/reports/android/
          if-no-files-found: error
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify APK signature and package metadata
        run: node mobile/scripts/inspect-android-apk.mjs mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/apk-report.json
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: salah-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload APK metadata
        uses: actions/upload-artifact@v4
        with:
          name: salah-android-debug-metadata
          path: mobile/android/app/build/outputs/apk/debug/apk-report.json
          if-no-files-found: error
