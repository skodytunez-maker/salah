name: Verify published nature release
on:
  pull_request:
    paths:
      - '.github/workflows/nature-audition.yml'
      - 'review/nature-audition/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public release bytes
        run: python3 review/nature-audition/verify-live-493.py '${{ runner.temp }}/salah-live-493.json'
      - uses: actions/upload-artifact@v4
        with:
          name: salah-live-493
          path: ${{ runner.temp }}/salah-live-493.json
          retention-days: 14
          if-no-files-found: error
