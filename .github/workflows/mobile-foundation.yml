name: Check SALAH mobile foundation
on:
  push:
    paths:
      - 'mobile/**'
      - 'scripts/check-mobile-foundation.mjs'
      - 'scripts/check-native-widget.mjs'
      - 'scripts/check-android-widget.mjs'
      - 'scripts/check-ios-widget.mjs'
      - '.github/workflows/mobile-foundation.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/check-mobile-foundation.mjs'
      - 'scripts/check-native-widget.mjs'
      - 'scripts/check-android-widget.mjs'
      - 'scripts/check-ios-widget.mjs'
      - '.github/workflows/mobile-foundation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-mobile-foundation.mjs
      - run: node scripts/check-native-widget.mjs
      - run: node scripts/check-android-widget.mjs
      - run: node scripts/check-ios-widget.mjs
